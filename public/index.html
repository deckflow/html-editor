<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Local HTML Editor</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand-lockup">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="m18 16 4-4-4-4" />
              <path d="m6 8-4 4 4 4" />
              <path d="m14.5 4-5 16" />
            </svg>
          </span>
          <div class="brand-copy">
            <h1>HTML Editor</h1>
            <p class="kicker">Local workspace</p>
          </div>
        </div>
        <div id="openPicker" class="file-controls">
          <button
            id="chooseFileBtn"
            class="file-picker-button"
            type="button"
            aria-haspopup="menu"
            aria-expanded="false"
            aria-controls="openPickerMenu"
          >
            <svg class="button-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 7.5V6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v2" />
              <path d="M3 10h17.4a1.6 1.6 0 0 1 1.5 2.1l-2 6A2 2 0 0 1 18 19.5H5a2 2 0 0 1-2-2Z" />
            </svg>
            <span>Open</span>
            <svg class="button-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m7 10 5 5 5-5" />
            </svg>
          </button>
          <div id="openPickerMenu" class="open-picker-menu" role="menu" hidden>
            <button type="button" role="menuitem" data-open-kind="file">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z" />
                <path d="M14 2v6h6" />
                <path d="m9 15 2 2 4-4" />
              </svg>
              <span><strong>HTML file</strong><small>Open one local .html file</small></span>
            </button>
            <button type="button" role="menuitem" data-open-kind="directory">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 7.5V6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z" />
              </svg>
              <span><strong>Folder</strong><small>Browse every HTML file inside</small></span>
            </button>
          </div>
          <input id="htmlFileInput" type="file" accept=".html" hidden />
        </div>
      </header>

      <section class="workspace" aria-label="Editor workspace">
        <aside id="fileSidebar" class="file-sidebar" aria-label="HTML files">
          <div class="file-sidebar-header">
            <div class="file-sidebar-title">
              <span>HTML files</span>
              <span id="fileCount" class="file-count">0</span>
            </div>
            <button
              id="toggleFilesBtn"
              class="sidebar-toggle"
              type="button"
              aria-expanded="true"
              aria-controls="fileSidebarBody"
              aria-label="Hide HTML files"
              title="Hide HTML files"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect width="18" height="18" x="3" y="3" rx="2" />
                <path d="M9 3v18" />
                <path d="m16 15-3-3 3-3" />
              </svg>
            </button>
          </div>
          <div id="fileSidebarBody" class="file-sidebar-body">
            <label class="file-search">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="11" cy="11" r="7" />
                <path d="m20 20-3.6-3.6" />
              </svg>
              <input id="fileSearch" type="search" placeholder="Filter files" aria-label="Filter HTML files" />
            </label>
            <nav id="fileList" class="file-list" aria-label="Workspace HTML files"></nav>
            <p id="fileListEmpty" class="file-list-empty" hidden>No matching HTML files</p>
          </div>
        </aside>

        <div class="preview-pane">
          <div class="preview-toolbar">
            <div id="previewStatus" class="preview-status" data-tone="normal">
              <span class="status-dot" aria-hidden="true"></span>
              <span id="status">Loading project...</span>
            </div>
            <button id="reloadBtn" class="icon-button" type="button" aria-label="Reload preview" title="Reload preview">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 12a9 9 0 0 0-15.2-6.5L3 8" />
                <path d="M3 3v5h5" />
                <path d="M3 12a9 9 0 0 0 15.2 6.5L21 16" />
                <path d="M16 16h5v5" />
              </svg>
            </button>
          </div>
          <iframe id="preview" title="Editable HTML preview" sandbox="allow-same-origin"></iframe>
        </div>

        <aside class="inspector" aria-label="Selected element inspector" hidden>
          <section class="selection">
            <p class="section-label">Selection</p>
            <div id="selectionName" class="selection-name">No element selected</div>
            <code id="selectorText">Click text in the preview</code>
          </section>

          <section class="control-group">
            <label for="textValue">Text</label>
            <textarea id="textValue" rows="7" disabled></textarea>
          </section>

          <section class="control-group">
            <label for="fontSize">Font size</label>
            <div class="inline-controls">
              <input id="fontSize" type="range" min="8" max="140" value="16" disabled />
              <input id="fontSizeNumber" type="number" min="8" max="140" value="16" disabled />
              <span>px</span>
            </div>
          </section>

          <section class="control-group">
            <label for="textColor">Text color</label>
            <div class="color-control">
              <input id="textColor" type="color" value="#15181d" disabled />
              <output id="textColorValue" for="textColor">#15181d</output>
            </div>
          </section>

          <section class="control-group">
            <span class="field-label">Position</span>
            <div class="grid-controls">
              <label>
                X
                <input id="posX" type="number" value="0" disabled />
              </label>
              <label>
                Y
                <input id="posY" type="number" value="0" disabled />
              </label>
            </div>
            <div class="nudge-grid" aria-label="Nudge selected element">
              <span></span>
              <button data-nudge="0,-1" type="button" disabled>Up</button>
              <span></span>
              <button data-nudge="-1,0" type="button" disabled>Left</button>
              <button data-nudge="0,1" type="button" disabled>Down</button>
              <button data-nudge="1,0" type="button" disabled>Right</button>
            </div>
          </section>

          <section class="control-group">
            <button id="clearBtn" type="button" disabled>Clear selection</button>
          </section>
        </aside>
      </section>
    </main>

    <script type="module" src="app.js?v=editor-interactions-v6"></script>
  </body>
</html>
