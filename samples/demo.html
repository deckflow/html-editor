<!doctype html>
<html lang="zh-CN"><head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sample Campaign Page</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #111317;
        --paper: #f7f4ed;
        --signal: #0d8f62;
        --coral: #e4543a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--paper);
        color: var(--ink);
        font-family: Georgia, "Times New Roman", serif;
      }

      main {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
      }

      .copy {
        padding: 9vw 7vw;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 28px;
      }

      .eyebrow {
        width: fit-content;
        padding: 8px 12px;
        border: 2px solid var(--ink);
        font-family: "Avenir Next", Helvetica, sans-serif;
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 760px;
        margin: 0;
        font-size: 88px;
        line-height: 0.92;
        letter-spacing: -0.02em;
      }

      .lede {
        max-width: 610px;
        margin: 0;
        font-family: "Avenir Next", Helvetica, sans-serif;
        font-size: 24px;
        line-height: 1.35;
      }

      .actions {
        display: flex;
        gap: 14px;
        align-items: center;
        font-family: "Avenir Next", Helvetica, sans-serif;
      }

      .primary {
        display: inline-flex;
        padding: 14px 20px;
        background: var(--ink);
        color: var(--paper);
        font-weight: 800;
        text-decoration: none;
      }

      .note {
        color: #64615b;
        font-size: 15px;
        font-weight: 700;
      }

      .poster {
        min-height: 100vh;
        padding: 36px;
        background:
          linear-gradient(135deg, rgba(13, 143, 98, 0.92), rgba(13, 143, 98, 0.64)),
          repeating-linear-gradient(90deg, transparent 0 22px, rgba(255, 255, 255, 0.18) 23px);
        display: grid;
        align-content: end;
      }

      .poster-card {
        background: var(--paper);
        border: 3px solid var(--ink);
        padding: 30px;
        box-shadow: 12px 12px 0 var(--coral);
        font-family: "Avenir Next", Helvetica, sans-serif;
      }

      .metric {
        margin: 0;
        font-size: 72px;
        line-height: 0.9;
        font-weight: 900;
      }

      .metric-label {
        margin: 14px 0 0;
        font-size: 18px;
        line-height: 1.3;
        font-weight: 800;
      }

      @media (max-width: 820px) {
        main {
          grid-template-columns: 1fr;
        }

        h1 {
          font-size: 56px;
        }

        .poster {
          min-height: 420px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="copy">
        <div id="eyebrow" class="eyebrow">Spring launch</div>
        <h1 id="headline">Make the page editable.</h1>
        <p class="lede">Click any text in the preview, change the words, tune the size, nudge the position, then save the edited HTML back to disk11.</p>
        <div class="actions">
          <a id="cta" class="primary" href="#">Start editing</a>
          <span id="note" class="note">No framework required.</span>
        </div>
      </section>
      <aside class="poster">
        <div class="poster-card">
          <p id="metric" class="metric">01</p>
          <p id="metric-label" class="metric-label">A small local editor for copy, type size, and layout nudges.</p>
        </div>
      </aside>
    </main>
  





</body></html>
